[package]
name = "kusuri-desktop"
version = "0.1.0"
edition = "2024"
authors = ["Kusuri Contributors"]
description = "24/7 Desktop Telemetry & Sync Client for Windows and Linux"

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["connect", "handshake"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
sysinfo = "0.33.1"
dirs = "6.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.26"
muda = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi"
] }
