# Konfigurasi Nginx untuk Kusuri
# Letakkan di /etc/nginx/sites-available/kusuri.conf

server {
    listen 80;
    server_name kusuri.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kusuri.example.com;

    ssl_certificate /etc/letsencrypt/live/kusuri.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kusuri.example.com/privkey.pem;

    client_max_body_size 100M;

    # REST API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Web Dashboard frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
