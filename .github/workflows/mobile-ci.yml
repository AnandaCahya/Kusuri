name: Mobile Android CI & Build

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  build-android:
    name: Build Kusuri Mobile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x apps/mobile/gradlew

      - name: Build Android Debug APK
        working-directory: apps/mobile
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kusuri-mobile-debug-apk
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
