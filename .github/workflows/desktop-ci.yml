name: Desktop CI & Build

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/desktop/**"
      - "Cargo.*"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/desktop/**"
      - "Cargo.*"
      - ".github/workflows/desktop-ci.yml"

jobs:
  build-windows:
    name: Build Kusuri Desktop (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --package kusuri-desktop

      - name: Stage Windows Executable & Setup Script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force
          Copy-Item "target/release/kusuri-desktop.exe" "dist/windows/"
          Copy-Item "apps/desktop/scripts/Setup-KusuriDesktop.ps1" "dist/windows/"
          Copy-Item "setup-desktop.bat" "dist/windows/"
          Compress-Archive -Path "dist/windows/*" -DestinationPath "dist/kusuri-desktop-windows-x86_64.zip"

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kusuri-desktop-windows-x86_64
          path: dist/kusuri-desktop-windows-x86_64.zip
          retention-days: 14

  build-linux:
    name: Build Kusuri Desktop (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev pkg-config libasound2-dev libudev-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --package kusuri-desktop

      - name: Stage Linux Binary & Service Script
        run: |
          mkdir -p dist/linux
          cp target/release/kusuri-desktop dist/linux/
          cp apps/desktop/scripts/install-linux.sh dist/linux/
          cp apps/desktop/scripts/kusuri-desktop.service dist/linux/
          tar -czvf dist/kusuri-desktop-linux-x86_64.tar.gz -C dist/linux .

      - name: Upload Linux Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kusuri-desktop-linux-x86_64
          path: dist/kusuri-desktop-linux-x86_64.tar.gz
          retention-days: 14
